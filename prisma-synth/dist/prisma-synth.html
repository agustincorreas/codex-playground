// ------------------------------------------------------------ caja de ritmos
// 8 instrumentos sintetizados: kick, snare, clap, hat cerrado, hat abierto,
// tom, rim, shaker. Cada kit ajusta afinación, decaimientos y brillo.
const DRUM_KIT_DEFS = [
  { // Clásica 808
    kick: { f0: 160, f1: 46, pd: 0.05, ad: 0.55, click: 0.25, drive: 0.35 }, snare: { f: 185, td: 0.12, nd: 0.2, hp: 1800, tone: 0.6 },
    clap: { d: 0.16, bp: 1100 }, chat: { d: 0.045, hp: 7500 }, ohat: { d: 0.35, hp: 7000 }, tom: { f0: 190, f1: 95, d: 0.4 }, rim: { f: 1700, d: 0.03 }, shaker: { d: 0.09, bp: 6500 },
  },
  { // Acústica
    kick: { f0: 130, f1: 58, pd: 0.03, ad: 0.28, click: 0.6, drive: 0.15 }, snare: { f: 210, td: 0.16, nd: 0.26, hp: 1200, tone: 0.9 },
    clap: { d: 0.2, bp: 1400 }, chat: { d: 0.07, hp: 6000 }, ohat: { d: 0.45, hp: 5500 }, tom: { f0: 240, f1: 120, d: 0.5 }, rim: { f: 2100, d: 0.05 }, shaker: { d: 0.12, bp: 5000 },
  },
  { // Techno
    kick: { f0: 210, f1: 50, pd: 0.045, ad: 0.4, click: 0.4, drive: 0.9 }, snare: { f: 240, td: 0.08, nd: 0.14, hp: 2500, tone: 0.4 },
    clap: { d: 0.12, bp: 1600 }, chat: { d: 0.03, hp: 9000 }, ohat: { d: 0.25, hp: 8500 }, tom: { f0: 160, f1: 70, d: 0.3 }, rim: { f: 2600, d: 0.02 }, shaker: { d: 0.06, bp: 8000 },
  },
  { // Lo-fi
    kick: { f0: 95, f1: 42, pd: 0.09, ad: 0.45, click: 0.1, drive: 0.5 }, snare: { f: 165, td: 0.2, nd: 0.22, hp: 900, tone: 0.7 },
    clap: { d: 0.25, bp: 800 }, chat: { d: 0.05, hp: 4000 }, ohat: { d: 0.3, hp: 3800 }, tom: { f0: 150, f1: 80, d: 0.45 }, rim: { f: 1300, d: 0.05 }, shaker: { d: 0.1, bp: 3500 },
  },
];
const DRUM_PANS = [0, 0.05, -0.15, 0.25, 0.3, -0.3, 0.2, -0.25];

class DrumVoice {
  constructor(sr) { this.sr = sr; this.active = false; this.t = 0; this.ph = 0; this.ph2 = 0; this.vel = 1; this.svf = new SVF(sr); this.lp = 0; }
  trigger(vel) { this.active = true; this.t = 0; this.ph = 0; this.ph2 = 0; this.vel = vel; this.svf.reset(); this.lp = 0; }
}
class DrumMachine {
  constructor(sr) {
    this.sr = sr;
    this.voices = Array.from({ length: 8 }, () => new DrumVoice(sr));
    this.tmp = new Float32Array(BLOCK);
  }
  hit(inst, vel) {
    if (inst < 0 || inst > 7) return;
    if (inst === 3) this.voices[4].active = false; // el hat cerrado apaga al abierto
    this.voices[inst].trigger(vel);
  }
  // renderiza y suma en L/R; kit 0..3, tone/decay 0..1 globales, level 0..1
  render(L, R, n, kit, tone, decay, level) {
    const K = DRUM_KIT_DEFS[clamp(kit | 0, 0, 3)];
    const dk = 0.5 + decay; // 0.5..1.5
    const bright = Math.pow(2, (tone - 0.5) * 2); // 0.5..2
    const sr = this.sr;
    for (let inst = 0; inst < 8; inst++) {
      const v = this.voices[inst];
      if (!v.active) continue;
      const tmp = this.tmp;
      const pan = DRUM_PANS[inst];
      const gl = Math.cos((pan + 1) * Math.PI / 4) * level * v.vel, gr = Math.sin((pan + 1) * Math.PI / 4) * level * v.vel;
      let alive = true;
      for (let i = 0; i < n; i++) {
        const t = v.t / sr;
        let s = 0;
        switch (inst) {
          case 0: { // kick
            const k = K.kick;
            const f = k.f1 + (k.f0 - k.f1) * Math.exp(-t / k.pd);
            v.ph += f / sr;
            const env = Math.exp(-t / (k.ad * dk));
            s = sinC(v.ph) * env;
            s = softclip(s * (1 + k.drive * 5)) / (1 + k.drive * 1.2);
            if (t < 0.004) s += (rnd() * 2 - 1) * k.click * bright * Math.exp(-t / 0.0012);
            if (env < 0.001) alive = false;
            break;
          }
          case 1: { // snare
            const k = K.snare;
            v.ph += k.f / sr; v.ph2 += k.f * 1.6 / sr;
            const toneS = (sinC(v.ph) + 0.6 * sinC(v.ph2)) * Math.exp(-t / (k.td * dk)) * 0.5 * k.tone;
            if (i === 0 || v.t === 0) v.svf.setCoeffs(clamp(k.hp * bright, 300, 12000), 0.2);
            const noise = v.svf.highpass(rnd() * 2 - 1) * Math.exp(-t / (k.nd * dk));
            s = (toneS + noise * 0.9) * 0.9;
            if (t > k.nd * dk * 6) alive = false;
            break;
          }
          case 2: { // clap: 3 ráfagas + cola
            const k = K.clap;
            if (v.t === 0) v.svf.setCoeffs(clamp(k.bp * bright, 300, 8000), 0.55);
            let env = 0;
            for (let b = 0; b < 3; b++) { const tb = t - b * 0.011; if (tb >= 0) env = Math.max(env, Math.exp(-tb / 0.006)); }
            if (t > 0.03) env = Math.max(env, Math.exp(-(t - 0.03) / (k.d * dk)) * 0.8);
            s = v.svf.bandpass(rnd() * 2 - 1) * env * 2.2;
            if (t > k.d * dk * 6) alive = false;
            break;
          }
          case 3: case 4: { // hats
            const k = inst === 3 ? K.chat : K.ohat;
            if (v.t === 0) v.svf.setCoeffs(clamp(k.hp * bright, 1000, 16000), 0.15);
            const env = Math.exp(-t / (k.d * dk));
            // ruido "metálico": suma de cuadradas rápidas + ruido blanco
            v.ph += 2837 / sr; v.ph2 += 4311 / sr;
            const metal = ((v.ph % 1) < 0.5 ? 1 : -1) * ((v.ph2 % 1) < 0.5 ? 1 : -1) * 0.3;
            s = v.svf.highpass((rnd() * 2 - 1) * 0.8 + metal) * env * 0.7;
            if (env < 0.001) alive = false;
            break;
          }
          case 5: { // tom
            const k = K.tom;
            const f = k.f1 + (k.f0 - k.f1) * Math.exp(-t / 0.08);
            v.ph += f / sr;
            const env = Math.exp(-t / (k.d * dk));
            s = (sinC(v.ph) + 0.15 * (rnd() * 2 - 1) * Math.exp(-t / 0.01)) * env * 0.9;
            if (env < 0.001) alive = false;
            break;
          }
          case 6: { // rim
            const k = K.rim;
            v.ph += k.f / sr; v.ph2 += k.f * 0.62 / sr;
            s = (sinC(v.ph) * 0.6 + sinC(v.ph2) * 0.4) * Math.exp(-t / (k.d * dk)) + (rnd() * 2 - 1) * Math.exp(-t / 0.003) * 0.5;
            if (t > k.d * dk * 8) alive = false;
            break;
          }
          default: { // shaker
            const k = K.shaker;
            if (v.t === 0) v.svf.setCoeffs(clamp(k.bp * bright, 800, 14000), 0.5);
            const env = Math.min(1, t / 0.006) * Math.exp(-t / (k.d * dk));
            s = v.svf.bandpass(rnd() * 2 - 1) * env * 1.6;
            if (t > k.d * dk * 6) alive = false;
          }
        }
        tmp[i] = s;
        v.t++;
        if (!alive) { v.active = false; for (let j = i + 1; j < n; j++) tmp[j] = 0; break; }
      }
      for (let i = 0; i < n; i++) { L[i] += tmp[i] * gl; R[i] += tmp[i] * gr; }
    }
  }
}

// ------------------------------------------------------------------ looper
// Looper de audio por capas, sincronizado al tempo. Graba la salida del sinte
// (post-FX) durante exactamente `bars` compases y suma las capas reproducidas.
const MAX_LAYERS = 8;
class Looper {
  constructor(sr) {
    this.sr = sr; this.len = 0; this.origin = 0; this.layers = []; this.playing = false;
    this.armed = false; this.recording = false; this.recL = null; this.recR = null; this.recPos = 0; this.playArmed = false;
    this.outL = new Float32Array(BLOCK); this.outR = new Float32Array(BLOCK);
    this.lenSeconds = 0;
  }
  get state() {
    if (this.recording) return 'recording';
    if (this.armed) return 'armed';
    if (!this.layers.length) return 'empty';
    return this.playing ? 'playing' : 'stopped';
  }
  command(cmd, arg) {
    switch (cmd) {
      case 'rec':
        if (this.recording) { this.commit(); break; }
        if (this.layers.length >= MAX_LAYERS) break;
        this.armed = !this.armed;
        break;
      case 'play': if (this.layers.length) { this.playArmed = !this.playing; if (this.playing) this.playing = false; } break;
      case 'stop': this.playing = false; this.playArmed = false; this.armed = false; if (this.recording) this.recording = false; break;
      case 'clear': this.layers = []; this.len = 0; this.playing = false; this.armed = false; this.recording = false; this.playArmed = false; break;
      case 'undo': this.layers.pop(); if (!this.layers.length) { this.len = 0; this.playing = false; } break;
      case 'mute': if (this.layers[arg]) this.layers[arg].mute = !this.layers[arg].mute; break;
      case 'remove': if (this.layers[arg]) { this.layers.splice(arg, 1); if (!this.layers.length) { this.len = 0; this.playing = false; } } break;
      case 'gain': if (this.layers[arg.layer]) this.layers[arg.layer].gain = arg.gain; break;
    }
  }
  commit() {
    this.recording = false;
    if (this.recL) { this.layers.push({ L: this.recL, R: this.recR, gain: 1, mute: false }); this.recL = null; this.recR = null; }
    this.playing = true;
  }
  // inL/inR: señal a grabar; suma la reproducción en outL/outR (n muestras)
  process(inL, inR, outL, outR, n, clock, barLen, bars, drumsOn, level) {
    const wantLen = Math.max(1, Math.round(barLen * bars));
    for (let i = 0; i < n; i++) {
      const t = clock + i;
      // arranque de grabación
      if (this.armed && !this.recording) {
        const boundary = this.len ? ((t - this.origin) % this.len === 0) : (drumsOn ? (t % barLen === 0) : true);
        if (boundary) {
          if (!this.len) { this.len = wantLen; this.origin = t; this.playing = true; }
          this.armed = false; this.recording = true; this.recPos = 0;
          this.recL = new Float32Array(this.len); this.recR = new Float32Array(this.len);
        }
      }
      if (this.playArmed && this.len) {
        const boundary = drumsOn ? (t % barLen === 0) : true;
        if (boundary) { this.playArmed = false; this.playing = true; this.origin = t; }
      }
      if (this.recording) {
        this.recL[this.recPos] = inL[i]; this.recR[this.recPos] = inR[i];
        this.recPos++;
        if (this.recPos >= this.len) this.commit();
      }
      if (this.playing && this.len) {
        let pos = (t - this.origin) % this.len; if (pos < 0) pos += this.len;
        let l = 0, r = 0;
        for (let k = 0; k < this.layers.length; k++) { const ly = this.layers[k]; if (ly.mute) continue; l += ly.L[pos] * ly.gain; r += ly.R[pos] * ly.gain; }
        outL[i] += l * level; outR[i] += r * level;
      }
    }
  }
  status(clock) {
    let pos = 0;
    if (this.len) { pos = ((clock - this.origin) % this.len + this.len) % this.len / this.len; }
    return { state: this.state, pos, layers: this.layers.map(l => ({ mute: l.mute, gain: l.gain })), recProgress: this.recording ? this.recPos / this.len : 0, bars: this.len ? Math.round(this.len / (this.lastBarLen || 1)) : 0 };
  }
}

const PARAMS = buildParams();
const PARAM_INDEX = Object.fromEntries(PARAMS.map(p => [p.id, p.index]));
const pidx = (id) => {
  const i = PARAM_INDEX[id];
  if (i === undefined) throw new Error('Unknown param ' + id);
  return i;
};

// ---- Conversión normalizado (0..1) <-> valor real
function denorm(def, n) {
  n = n < 0 ? 0 : n > 1 ? 1 : n;
  switch (def.curve) {
    case 'exp': return def.min * Math.pow(def.max / def.min, n);
    case 'int':
    case 'enum': return Math.round(def.min + n * (def.max - def.min));
    default: return def.min + n * (def.max - def.min);
  }
}
function norm(def, v) {
  let n;
  if (def.curve === 'exp') n = Math.log(v / def.min) / Math.log(def.max / def.min);
  else n = (v - def.min) / (def.max - def.min);
  return n < 0 ? 0 : n > 1 ? 1 : n;
}
function isGlobalParam(id) {
  return id.startsWith('fx') || id.startsWith('master') || id.startsWith('arp') || id.startsWith('drum') || id.startsWith('loop');
}
// Parámetros que pertenecen a la sesión (no cambian al cargar un sonido)
function isSongParam(id) {
  return id.startsWith('drum') || id.startsWith('loop') || id === 'master.tempo' || id === 'master.volume';
}

function formatValue(def, v) {
  if (def.opts) return def.opts[Math.round(v)] ?? String(v);
  if (def.curve === 'int') return `${Math.round(v)}${def.unit ? ' ' + def.unit : ''}`;
  const u = def.unit;
  if (u === 'Hz') return v >= 1000 ? `${(v / 1000).toFixed(2)} kHz` : `${v.toFixed(v < 100 ? 2 : 1)} Hz`;
  if (u === 's') return v < 1 ? `${(v * 1000).toFixed(0)} ms` : `${v.toFixed(2)} s`;
  if (u === 'ms') return `${v.toFixed(v < 10 ? 1 : 0)} ms`;
  if (u === 'ct' || u === 'st' || u === 'dB') return `${v > 0 ? '+' : ''}${v.toFixed(u === 'ct' ? 0 : 1)} ${u}`;
  if (u === 'bpm') return `${v.toFixed(0)} bpm`;
  if (u) return `${v.toFixed(2)} ${u}`;
  if (def.min === 0 && def.max === 1) return `${Math.round(v * 100)}%`;
  if (def.min === -1 && def.max === 1) return `${Math.round(v * 100)}%`;
  return v.toFixed(2);
}

// Grilla de pads en escala: 3 filas × 8 grados. Nunca suena una nota fuera de

// Visualizadores: analizador maestro animado (vista Play), osciloscopios de

class MasterVisualizer {
  constructor(canvas, analyser) {

      const bin = Math.floor(Math.pow(i / bars, 2) * 400) + 1;
      const v = this.freq[bin] / 255;
      const a = (i / bars) * Math.PI * 2 - Math.PI / 2 + this.t * 0.3;
      const len = v * R * 1.1;
      const hue = 190 + (i / bars) * 60 + v * 40;

      ctx.lineWidth = Math.max(1.5, W / 400) * devicePixelRatio;

      ctx.moveTo(cx + Math.cos(a) * (R + 6), cy + Math.sin(a) * (R + 6));
      ctx.lineTo(cx + Math.cos(a) * (R + 6 + len), cy + Math.sin(a) * (R + 6 + len));
      ctx.stroke();

  constructor(canvas, color) { this.canvas = canvas; this.color = color; this.data = null; }
  draw() {

      this.app.showTip(this, true);
    });
    const end = (e) => { if (!dragging) return; dragging = false; root.classList.remove('dragging'); this.app.showTip(this, false); };
    root.addEventListener('pointerup', end); root.addEventListener('pointercancel', end);
    root.addEventListener('dblclick', () => {
      if (this.app.assignSource >= 0) this.app.removeMod(this.app.assignSource, this.idx);
      else this.app.setNorm(this.idx, this.app.defaultNorm(this.idx));
    });
    root.addEventListener('wheel', (e) => {
      e.preventDefault();
      const d = (e.deltaY > 0 ? -1 : 1) * (e.shiftKey ? 0.002 : 0.02);
      if (this.app.assignSource >= 0) {
        const m = this.app.modsFor(this.idx).find(x => x.src === this.app.assignSource);
        this.app.setMod(this.app.assignSource, this.idx, Math.max(-1, Math.min(1, (m ? m.amt : 0) + d)));
      } else this.app.setNorm(this.idx, Math.max(0, Math.min(1, this.norm + d)));
    }, { passive: false });
    root.addEventListener('contextmenu', (e) => { e.preventDefault(); this.app.openModPopover(this); });
    // drop de fuentes de modulación
    root.addEventListener('dragover', (e) => { if (e.dataTransfer.types.includes('text/prisma-source')) { e.preventDefault(); root.classList.add('drop-hover'); } });
    root.addEventListener('dragleave', () => root.classList.remove('drop-hover'));
    root.addEventListener('drop', (e) => {
      e.preventDefault(); root.classList.remove('drop-hover');
      const src = e.dataTransfer.getData('text/prisma-source');
      if (src === '') return;
      const si = parseInt(src, 10);
      if (!this.app.modsFor(this.idx).some(m => m.src === si)) this.app.setMod(si, this.idx, 0.3);
      this.app.openModPopover(this, si);
    });
  }
}

class EnumControl {

    sel.addEventListener('change', () => this.app.setNorm(this.idx, this.def.opts.length > 1 ? sel.selectedIndex / (this.def.opts.length - 1) : 0));
    root.appendChild(sel);

class Toggle {

class Slider {
  // deslizador vertical (para ADSR)
  constructor(app, idx, opts = {}) {
    this.app = app; this.idx = idx; this.def = app.def(idx);
    const root = this.el = document.createElement('div');
    root.className = 'vslider'; root.dataset.param = this.def.id;
    if (opts.color) root.style.setProperty('--kc', opts.color);
    this.track = document.createElement('div'); this.track.className = 'vs-track';
    this.fill = document.createElement('div'); this.fill.className = 'vs-fill';
    this.track.appendChild(this.fill); root.appendChild(this.track);
    const l = document.createElement('div'); l.className = 'k-label'; l.textContent = opts.label || this.def.name; root.appendChild(l);
    this.valueEl = document.createElement('div'); this.valueEl.className = 'k-value'; root.appendChild(this.valueEl);
    let dragging = false, startY = 0, startN = 0;
    root.addEventListener('pointerdown', (e) => { e.preventDefault(); root.setPointerCapture(e.pointerId); dragging = true; startY = e.clientY; startN = this.app.getNorm(this.idx); });
    root.addEventListener('pointermove', (e) => { if (!dragging) return; const h = this.track.clientHeight || 80; this.app.setNorm(this.idx, Math.max(0, Math.min(1, startN + (startY - e.clientY) / h))); });
    const end = () => { dragging = false; };
    root.addEventListener('pointerup', end); root.addEventListener('pointercancel', end);
    root.addEventListener('dblclick', () => this.app.setNorm(this.idx, this.app.defaultNorm(this.idx)));
    root.addEventListener('dragover', (e) => { if (e.dataTransfer.types.includes('text/prisma-source')) { e.preventDefault(); root.classList.add('drop-hover'); } });
    root.addEventListener('dragleave', () => root.classList.remove('drop-hover'));
    root.addEventListener('drop', (e) => { e.preventDefault(); root.classList.remove('drop-hover'); const s = e.dataTransfer.getData('text/prisma-source'); if (s !== '') { const si = parseInt(s, 10); if (!this.app.modsFor(this.idx).some(m => m.src === si)) this.app.setMod(si, this.idx, 0.3); } });
    this.update();
  }
  update() {
    const n = this.app.getNorm(this.idx);
    this.fill.style.height = `${n * 100}%`;
    this.valueEl.textContent = formatValue(this.def, denorm(this.def, n));
    this.el.classList.toggle('has-mods', this.app.modsFor(this.idx).length > 0);
  }
  live() {}
}

function createControl(app, idx, opts = {}) {
  const def = app.def(idx);
  if (def.curve === 'enum') {
    if (def.opts.length === 2 && opts.toggle !== false) return new Toggle(app, idx, opts);
    return new EnumControl(app, idx, opts);
  }
  if (opts.slider) return new Slider(app, idx, opts);
  return new Knob(app, idx, opts);
}


// ---- js/audio/engine.js
// Envoltorio del AudioContext: carga el worklet, envía parámetros/notas y
// recibe medición (fuentes de modulación, osciloscopios) para la UI.

class SynthAudio {
  constructor() {
    this.ctx = null; this.node = null; this.analyser = null; this.ready = false;
    this.onMeter = null; this.queue = [];
  }
  async init() {
    if (this.ctx) return;
    const ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    try {
      const inline = document.getElementById('worklet-src');
      if (inline) {
        // versión de un solo archivo: el worklet viaja embebido. Blob funciona
        // en http(s); data: es el respaldo para file:// (origen opaco).
        const src = inline.textContent;
        try { await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([src], { type: 'application/javascript' }))); }
        catch (e) { await ctx.audioWorklet.addModule('data:application/javascript;charset=utf-8,' + encodeURIComponent(src)); }
      } else {
        const url = new URL('./synth-processor.js', import.meta.url);
        try { await ctx.audioWorklet.addModule(url.href); }
        catch (e) {
          const src = await (await fetch(url.href)).text();
          await ctx.audioWorklet.addModule('data:application/javascript;charset=utf-8,' + encodeURIComponent(src));
        }
      }
      const defs = PARAMS.map(p => ({ id: p.id, min: p.min, max: p.max, def: p.def, curve: p.curve }));
      const fxTypes = FX_TYPES.map(f => ({ id: f.id, params: f.params.map(p => ({ min: p.min, max: p.max, curve: p.curve })) }));
      this.node = new AudioWorkletNode(ctx, 'prisma-synth', {
        numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2],
        processorOptions: { defs, fxTypes, lfoDivBeats: LFO_DIV_BEATS, arpDivBeats: ARP_DIV_BEATS, drumPatterns: DRUM_PATTERNS, loopBars: LOOP_BARS },
      });
      this.analyser = ctx.createAnalyser();
      this.analyser.fftSize = 2048; this.analyser.smoothingTimeConstant = 0.75;
      this.node.connect(this.analyser); this.analyser.connect(ctx.destination);
      this.node.port.onmessage = (e) => {
        const m = e.data;
        if (m.type === 'meter' && this.onMeter) this.onMeter(m);
        if (m.type === 'ready') { this.ready = true; for (const q of this.queue) this.node.port.postMessage(q); this.queue = []; }
      };
      this.ctx = ctx;
    } catch (e) {
      ctx.close().catch(() => {});
      this.node = null; this.analyser = null;
      throw e;
    }
    if (ctx.state !== 'running') await ctx.resume().catch(() => {});
  }
  async resume() { if (this.ctx && this.ctx.state !== 'running') await this.ctx.resume(); }
  post(m, transfer) {
    if (!this.node) return;
    if (!this.ready) { this.queue.push(m); return; }
    this.node.port.postMessage(m, transfer || []);
  }
  setParam(idx, value) { this.post({ type: 'param', idx, value }); }
  setAllParams(values) { this.post({ type: 'params', values: Float32Array.from(values) }); }
  setMods(slots) { this.post({ type: 'mods', slots: slots.map(s => ({ src: s.src, dst: s.dst, amt: s.amt })) }); }
  noteOn(note, vel = 0.8) { this.post({ type: 'note', on: true, note, vel }); }
  noteOff(note) { this.post({ type: 'note', on: false, note }); }
  modwheel(v) { this.post({ type: 'modwheel', value: v }); }
  bend(v) { this.post({ type: 'bend', value: v }); }
  sustain(on) { this.post({ type: 'sustain', on }); }
  allOff() { this.post({ type: 'allOff' }); }
  loop(cmd, arg) { this.post({ type: 'loop', cmd, arg }); }
  drum(inst, vel = 1) { this.post({ type: 'drum', inst, vel }); }
  resetClock() { this.post({ type: 'resetClock' }); }
  panic() { this.post({ type: 'panic' }); }
  async loadSample(arrayBuffer) {
    const buf = await this.ctx.decodeAudioData(arrayBuffer);
    const n = Math.min(buf.length, this.ctx.sampleRate * 20);
    const mono = new Float32Array(n);
    for (let ch = 0; ch < buf.numberOfChannels; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < n; i++) mono[i] += d[i] / buf.numberOfChannels;
    }
    // normalizar
    let mx = 0; for (let i = 0; i < n; i++) mx = Math.max(mx, Math.abs(mono[i]));
    if (mx > 0) for (let i = 0; i < n; i++) mono[i] /= mx;
    this.post({ type: 'sample', data: mono, root: 261.63 }, [mono.buffer]);
    return { duration: n / this.ctx.sampleRate };
  }
}

// ---- Web MIDI: gestor de entradas con selección de dispositivo
class MidiManager {
  constructor(handlers) {
    this.handlers = handlers; this.access = null; this.selectedId = 'all'; this.onChange = null; this.onActivity = null;
    this.error = null;
  }
  get supported() { return !!navigator.requestMIDIAccess; }
  async connect() {
    if (this.access) return true;
    if (!this.supported) { this.error = 'Este navegador no soporta Web MIDI (usá Chrome, Edge u Opera).'; return false; }
    try {
      this.access = await navigator.requestMIDIAccess({ sysex: false });
      this.access.onstatechange = () => { this.attach(); if (this.onChange) this.onChange(this.inputs()); };
      this.attach();
      if (this.onChange) this.onChange(this.inputs());
      return true;
    } catch (e) {
      this.error = 'No se pudo acceder a MIDI: ' + String(e.message || e.name).replace(/\.$/, '') + '. Si estás dentro de un iframe (p. ej. un artifact), abrí la app en una pestaña propia.';
      return false;
    }
  }
  inputs() {
    if (!this.access) return [];
    return [...this.access.inputs.values()].map(i => ({ id: i.id, name: i.name || 'MIDI input', manufacturer: i.manufacturer || '', state: i.state }));
  }
  outputsAudio() { return []; }
  select(id) { this.selectedId = id; this.attach(); }
  attach() {
    if (!this.access) return;
    for (const input of this.access.inputs.values()) {
      const active = this.selectedId === 'all' || input.id === this.selectedId;
      input.onmidimessage = active ? (e) => this.message(e) : null;
    }
  }
  message(e) {
    const [st, d1, d2] = e.data;
    const cmd = st & 0xf0, h = this.handlers;
    if (this.onActivity) this.onActivity();
    if (cmd === 0x90 && d2 > 0) h.noteOn(d1, d2 / 127);
    else if (cmd === 0x80 || (cmd === 0x90 && d2 === 0)) h.noteOff(d1);
    else if (cmd === 0xb0) h.cc(d1, d2 / 127);
    else if (cmd === 0xe0) h.bend(((d2 << 7) | d1) / 8192 - 1);
  }
}

// ---- Salida de audio: lista de dispositivos y cambio con setSinkId (Chrome/Edge)
async function listAudioOutputs() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return [];
  const devs = await navigator.mediaDevices.enumerateDevices();
  return devs.filter(d => d.kind === 'audiooutput').map((d, i) => ({ id: d.deviceId, name: d.label || `Salida ${i + 1}` }));
}
function canSelectOutput(ctx) { return !!(ctx && typeof ctx.setSinkId === 'function'); }


// ---- js/main.js
// Prisma Synth — aplicación principal: estado, vistas, modulación por
// arrastrar y soltar, presets, MIDI y visualización en tiempo real.

const $ = (sel, root = document) => root.querySelector(sel);
const h = (tag, attrs = {}, ...children) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(e.dataset, v);
    else e.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  return e;
};

// Parámetros específicos por tipo de motor (en el orden en que se muestran)
const ENGINE_PARAMS = {
  va: ['va.wave', 'va.pw', 'va.unison', 'va.detune', 'va.spread', 'va.sync', 'va.sub', 'va.subWave', 'va.noise'],
  wt: ['wt.table', 'wt.pos', 'wt.warp', 'wt.warpMode', 'wt.unison', 'wt.detune', 'wt.spread'],
  fm: ['fm.alg', 'fm.ratio2', 'fm.index2', 'fm.ratio3', 'fm.index3', 'fm.feedback', 'fm.shape'],
  gran: ['gran.source', 'gran.size', 'gran.density', 'gran.pos', 'gran.spray', 'gran.pitchRnd', 'gran.shape', 'gran.scan'],
  harm: ['harm.partials', 'harm.tilt', 'harm.oddEven', 'harm.stretch', 'harm.comb', 'harm.detune'],
  modal: ['modal.material', 'modal.modes', 'modal.decay', 'modal.damp', 'modal.pos', 'modal.exciter', 'modal.exLen', 'modal.bright'],
  smp: ['smp.source', 'smp.start', 'smp.loop', 'smp.loopLen', 'smp.tone'],
};
const BIG_PARAM = { va: 'va.detune', wt: 'wt.pos', fm: 'fm.index2', gran: 'gran.pos', harm: 'harm.partials', modal: 'modal.material', smp: 'smp.start' };

class App {
  constructor() {
    this.norm = new Float32Array(PARAMS.length);
    PARAMS.forEach((p, i) => { this.norm[i] = norm(p, p.def); });
    this.mods = [];
    this.meta = { name: 'Init', category: 'Template', description: '', macroNames: ['Macro 1', 'Macro 2', 'Macro 3', 'Macro 4'] };
    this.assignSource = -1;
    this.controls = new Map(); // idx → [control]
    this.audio = new SynthAudio();
    this.liveSrc = new Float32Array(MOD_SOURCES.length);
    this.scopes = {}; this.envCanvases = []; this.lfoCanvases = [];
    this.view = 'jam';
    this.song = Object.assign({ key: 0, scale: 'minor', chord: 'off', octave: 3, scaleLock: true, padMode: 'notes' }, JSON.parse(localStorage.getItem('prisma.song') || '{}'));
    this.activeChords = new Map(); // nota base → notas enviadas
    this.userPresets = JSON.parse(localStorage.getItem('prisma.userPresets') || '[]');
    this.presetIndex = 0;
    this.started = false;
    this.octave = 3;
    this.midiOk = false;
    this.midi = new MidiManager({
      noteOn: (n, v) => this.performOn(n, v, true),
      noteOff: (n) => this.performOff(n, true),
      bend: (v) => this.audio.bend(v),
      cc: (cc, v) => {
        if (cc === 1) { this.audio.modwheel(v); if (this.modwheelEl) this.modwheelEl.value = v * 100; }
        else if (cc === 64) this.audio.sustain(v > 0.5);
        else if (cc >= 20 && cc <= 23) this.setNorm(pidx(`macro${cc - 19}`), v);
        else if (cc === 74) this.setNorm(pidx('f1.cutoff'), v);
        else if (cc === 71) this.setNorm(pidx('f1.res'), v);
      },
    });
    this.midi.onChange = () => this.refreshDevices();
    this.midi.onActivity = () => this.midiBlink();
  }

  // ---- API usada por los controles
  def(idx) { return PARAMS[idx]; }
  getNorm(idx) { return this.norm[idx]; }
  defaultNorm(idx) { return norm(PARAMS[idx], PARAMS[idx].def); }
  setNorm(idx, n, opts = {}) {
    if (this.norm[idx] === n && !opts.force) return;
    this.norm[idx] = n;
    this.audio.setParam(idx, n);
    this.refresh(idx);
    const id = PARAMS[idx].id;
    if (id === 'a.type' || id === 'b.type') this.buildEngineBody(id[0]);
    if (/^fx\d\.type$/.test(id)) { this.applyFxDefaults(parseInt(id[2], 10)); this.buildFxSlot(parseInt(id[2], 10)); }
    if (id === 'arp.on') this.refreshArpBadge();
    if (id === 'arp.pattern') this.refreshArpDesc();
  }
  setValue(id, value) { const d = PARAMS[pidx(id)]; this.setNorm(d.index, norm(d, value)); }
  value(id) { const d = PARAMS[pidx(id)]; return denorm(d, this.norm[d.index]); }
  refresh(idx) { const cs = this.controls.get(idx); if (cs) for (const c of cs) c.update(); }
  refreshAll() { for (const cs of this.controls.values()) for (const c of cs) c.update(); this.buildMatrix(); this.refreshChips(); this.refreshArpBadge(); }
  refreshArpDesc() { if (this.arpDesc) { const p = ARP_PATTERNS[Math.round(this.value('arp.pattern'))]; this.arpDesc.textContent = p ? p.desc : ''; } }
  register(ctl) { if (!this.controls.has(ctl.idx)) this.controls.set(ctl.idx, []); this.controls.get(ctl.idx).push(ctl); return ctl; }
  unregisterIn(root) {
    for (const [idx, list] of this.controls) {
      const keep = list.filter(c => !root.contains(c.el));
      if (keep.length) this.controls.set(idx, keep); else this.controls.delete(idx);
    }
  }
  modsFor(idx) { return this.mods.filter(m => m.dst === idx); }
  setMod(src, dst, amt) {
    if (PARAMS[dst].nomod) return;
    const m = this.mods.find(x => x.src === src && x.dst === dst);
    if (m) m.amt = amt; else this.mods.push({ src, dst, amt });
    this.pushMods(); this.refresh(dst); this.buildMatrix();
  }
  removeMod(src, dst) { this.mods = this.mods.filter(x => !(x.src === src && x.dst === dst)); this.pushMods(); this.refresh(dst); this.buildMatrix(); }
  pushMods() { this.audio.setMods(this.mods); this.refreshChips(); }
  showTip() {}
  setAssign(src) {
    this.assignSource = this.assignSource === src ? -1 : src;
    document.body.classList.toggle('assign-mode', this.assignSource >= 0);
    document.body.style.setProperty('--assign-color', this.assignSource >= 0 ? MOD_SOURCES[this.assignSource].color : 'transparent');
    $('#assign-banner').hidden = this.assignSource < 0;
    if (this.assignSource >= 0) $('#assign-banner-name').textContent = MOD_SOURCES[this.assignSource].name;
    for (const cs of this.controls.values()) for (const c of cs) if (c.updateMods) c.updateMods();

  }
  openModPopover(knob, src) {
    const pop = $('#mod-popover');
    const mods = this.modsFor(knob.idx);
    if (!mods.length) { pop.hidden = true; return; }
    pop.innerHTML = '';
    pop.appendChild(h('div', { class: 'pop-title' }, `${knob.def.name}`, h('button', { class: 'pop-close', onclick: () => { pop.hidden = true; } }, '×')));
    for (const m of mods) {
      const s = MOD_SOURCES[m.src];
      const row = h('div', { class: 'pop-row', style: `--kc:${s.color}` });
      const amtLabel = h('span', { class: 'pop-amt' }, `${Math.round(m.amt * 100)}%`);
      const range = h('input', { type: 'range', min: -100, max: 100, value: Math.round(m.amt * 100) });
      range.addEventListener('input', () => { this.setMod(m.src, knob.idx, range.value / 100); amtLabel.textContent = `${range.value}%`; });
      row.append(h('span', { class: 'chip chip-sm', style: `--kc:${s.color}` }, s.short), range, amtLabel,
        h('button', { class: 'pop-del', onclick: () => { this.removeMod(m.src, knob.idx); this.openModPopover(knob); } }, '✕'));
      pop.appendChild(row);
    }
    if (!mods.length) pop.hidden = true;
    const r = knob.el.getBoundingClientRect();
    pop.hidden = false;
    const pw = pop.offsetWidth, ph = pop.offsetHeight;
    let x = r.left + r.width / 2 - pw / 2, y = r.bottom + 6;
    x = Math.max(8, Math.min(window.innerWidth - pw - 8, x));
    if (y + ph > window.innerHeight - 8) y = r.top - ph - 6;
    pop.style.left = `${x}px`; pop.style.top = `${y}px`;
    if (src !== undefined) { const inp = pop.querySelectorAll('input')[mods.findIndex(m => m.src === src)]; if (inp) inp.focus(); }
  }

  // ---- construcción de UI
  build() {
    this.buildHeader();
    this.buildSynthView();
    this.buildFxView();
    this.buildJamView();
    this.buildFooter();
    this.buildDevicesPanel();
    this.showView('jam');
    document.addEventListener('pointerdown', (e) => { const pop = $('#mod-popover'); if (!pop.hidden && !pop.contains(e.target) && !e.target.closest('.knob')) pop.hidden = true; const dp = $('#devices-panel'); if (dp && !dp.hidden && !dp.contains(e.target) && !e.target.closest('#midi-ind')) dp.hidden = true; });
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && this.assignSource >= 0) this.setAssign(this.assignSource); });
    this.loadPreset(1);
    this.songChanged();
    this.refreshArpDesc();
    this.startLoop();
  }

  applyFxDefaults(slot) {
    const t = FX_TYPES[Math.round(this.value(`fx${slot}.type`))];
    t.params.forEach((p, k) => { const idx = pidx(`fx${slot}.p${k}`); const n = p.curve === 'enum' ? (p.max > 0 ? p.def / p.max : 0) : norm(p, p.def); this.norm[idx] = n; this.audio.setParam(idx, n); });
  }
  buildFxSlot(slot) {
    const body = this.fxSlotEls && this.fxSlotEls[slot]; if (!body) return;
    this.unregisterIn(body); body.innerHTML = '';
    const t = FX_TYPES[Math.round(this.value(`fx${slot}.type`))];
    if (!t.params.length) { body.append(h('p', { class: 'hint' }, 'Slot vacío. Elegí un efecto.')); return; }
    const row = h('div', { class: 'knob-row wrap' });
    t.params.forEach((p, k) => {
      const idx = pidx(`fx${slot}.p${k}`);
      // vista "virtual" del parámetro genérico con el rango del efecto
      const vdef = { ...PARAMS[idx], name: p.name, min: p.min, max: p.max, curve: p.curve, unit: p.unit, opts: p.opts };
      const facade = this.fxFacade(idx, vdef);
      const ctl = p.curve === 'enum' ? new EnumControl(facade, idx, { color: COLORS.fx, label: p.name }) : new Knob(facade, idx, { color: COLORS.fx, size: k === 0 ? 'lg' : 'md', label: p.name });
      this.register(ctl); row.append(ctl.el);

    body.append(row);

  fxFacade(idx, vdef) {
    // Un proxy de App que presenta la definición virtual del parámetro FX
    const app = this;

      get(target, prop) {
        if (prop === 'def') return (i) => (i === idx ? vdef : target.def(i));
        if (prop === 'defaultNorm') return (i) => (i === idx ? (vdef.curve === 'enum' ? (vdef.max > 0 ? vdef.def / vdef.max : 0) : norm(vdef, vdef.def)) : target.defaultNorm(i));

        const v = target[prop];

    const o = $('#jam-oct'); if (o) o.textContent = `Oct ${this.song.octave}`;

      ? 'Cada columna es un acorde de la tonalidad. Fila de abajo: nota grave (bajo). Medio: el acorde. Arriba: el acorde una octava más alto.'

    this.midiSel = h('select', { id: 'midi-in-select' });
    this.midiSel.addEventListener('change', () => { this.midi.select(this.midiSel.value); localStorage.setItem('prisma.midiIn', this.midiSel.value); });
    this.midiStatus = h('div', { class: 'dev-status' }, 'MIDI no conectado.');
    this.midiConnectBtn = h('button', { class: 'tb', onclick: () => this.connectMidi(false) }, 'Conectar MIDI');
    this.audioSel = h('select', { id: 'audio-out-select' });
    this.audioSel.addEventListener('change', async () => {
      try {
        await this.audio.ctx.setSinkId(this.audioSel.value === 'default' ? '' : this.audioSel.value);
        this.audioStatus.textContent = 'Salida cambiada.';
      } catch (e) { this.audioStatus.textContent = 'No se pudo cambiar la salida: ' + e.message; }
    });
    this.audioStatus = h('div', { class: 'dev-status' }, '');
    const refreshBtn = h('button', { class: 'tb', onclick: () => this.refreshDevices(true) }, 'Actualizar');
    panel.append(
      h('div', { class: 'pop-title' }, 'Dispositivos', h('button', { class: 'pop-close', onclick: () => { panel.hidden = true; } }, '×')),
      h('div', { class: 'dev-section' },
        h('div', { class: 'dev-label' }, 'Entrada MIDI', h('span', { id: 'midi-activity', class: 'midi-dot' })),
        h('div', { class: 'dev-row' }, this.midiSel, this.midiConnectBtn),
        this.midiStatus,
        h('p', { class: 'hint' }, 'Notas, pitch bend, CC1 mod wheel, CC64 sustain, CC20–23 macros, CC74 cutoff, CC71 resonancia.'),
      ),
      h('div', { class: 'dev-section' },
        h('div', { class: 'dev-label' }, 'Salida de audio'),
        h('div', { class: 'dev-row' }, this.audioSel, refreshBtn),
        this.audioStatus,
      ),
    );
    document.body.append(panel);
    this.devicesPanel = panel;
    this.refreshDevices();
  }
  toggleDevices() {
    const p = this.devicesPanel;
    if (!p.hidden) { p.hidden = true; return; }
    this.refreshDevices();
    p.hidden = false;
    const r = $('#midi-ind').getBoundingClientRect();
    p.style.top = `${r.bottom + 6}px`;
    p.style.left = `${Math.max(8, Math.min(window.innerWidth - p.offsetWidth - 8, r.left + r.width / 2 - p.offsetWidth / 2))}px`;
    if (!this.midi.access) this.connectMidi(true);
  }
  async connectMidi(silent) {
    const ok = await this.midi.connect();
    this.midiOk = ok;
    $('#midi-ind').classList.toggle('on', ok);
    if (ok) {
      const saved = localStorage.getItem('prisma.midiIn');
      if (saved && this.midi.inputs().some(i => i.id === saved)) this.midi.select(saved);
    } else if (!silent) alert(this.midi.error);
    this.refreshDevices();
  }
  async refreshDevices(requestLabels) {
    if (!this.midiSel) return;
    const inputs = this.midi.inputs();
    this.midiSel.innerHTML = '';
    this.midiSel.append(h('option', { value: 'all' }, inputs.length ? 'Todos los dispositivos' : '(sin dispositivos MIDI)'));
    for (const i of inputs) this.midiSel.append(h('option', { value: i.id }, `${i.name}${i.manufacturer ? ' · ' + i.manufacturer : ''}`));
    this.midiSel.value = inputs.some(i => i.id === this.midi.selectedId) ? this.midi.selectedId : 'all';
    this.midiSel.disabled = !this.midi.access;
    this.midiConnectBtn.hidden = !!this.midi.access;
    if (this.midi.access) this.midiStatus.textContent = inputs.length ? `${inputs.length} entrada(s) MIDI detectada(s). Conectá o desconectá dispositivos y la lista se actualiza sola.` : 'MIDI activo pero sin dispositivos. Conectá tu teclado por USB; aparecerá automáticamente.';
    else this.midiStatus.textContent = this.midi.error || 'Pulsá "Conectar MIDI" y aceptá el permiso del navegador.';
    // salida de audio
    const ctx = this.audio.ctx;
    this.audioSel.innerHTML = ''; this.audioStatus.textContent = '';
    if (!canSelectOutput(ctx)) {
      this.audioSel.append(h('option', { value: 'default' }, 'Salida predeterminada del sistema'));
      this.audioSel.disabled = true;
      this.audioStatus.textContent = ctx ? 'Este navegador no permite elegir la salida (usá la configuración del sistema).' : 'Pulsá Start para iniciar el audio.';
      return;
    }
    this.audioSel.disabled = false;
    let outs = [];
    try {
      if (requestLabels && navigator.mediaDevices.getUserMedia) {
        // los nombres de dispositivos solo se muestran tras un permiso de medios
        try { const st = await navigator.mediaDevices.getUserMedia({ audio: true }); st.getTracks().forEach(t => t.stop()); } catch (e) { /* sin permiso: se listan sin nombre */ }
      }
      outs = await listAudioOutputs();
    } catch (e) { outs = []; }
    this.audioSel.append(h('option', { value: 'default' }, 'Salida predeterminada del sistema'));
    for (const o of outs) if (o.id && o.id !== 'default') this.audioSel.append(h('option', { value: o.id }, o.name));
    const cur = ctx.sinkId || 'default';
    this.audioSel.value = [...this.audioSel.options].some(o => o.value === cur) ? cur : 'default';
    if (!this.audioStatus.textContent) this.audioStatus.textContent = outs.some(o => /^Salida \d+$/.test(o.name)) ? 'Pulsá "Actualizar" y aceptá el permiso para ver los nombres de las salidas.' : '';
  }
  midiBlink() {
    const d = $('#midi-activity'); const ind = $('#midi-ind');
    if (d) { d.classList.add('on'); clearTimeout(this._blinkT); this._blinkT = setTimeout(() => d.classList.remove('on'), 120); }
    if (ind) { ind.classList.add('blink'); clearTimeout(this._blinkT2); this._blinkT2 = setTimeout(() => ind.classList.remove('blink'), 120); }
  }

  // ---- presets
  allPresets() { return [...PRESETS, ...this.userPresets]; }
  fillPresetSelect() {
    const sel = this.presetSel; sel.innerHTML = '';
    const all = this.allPresets();
    const groups = {};
    all.forEach((p, i) => { const g = i >= PRESETS.length ? 'User' : p.category; (groups[g] = groups[g] || []).push([p, i]); });
    for (const [g, list] of Object.entries(groups)) {
      const og = h('optgroup', { label: g });
      for (const [p, i] of list) og.append(h('option', { value: i }, p.name));
      sel.append(og);
    }
    sel.value = this.presetIndex;
  }
  presetToState(p) {
    // valores por defecto, conservando el estado de sesión (ritmo, looper, tempo, volumen)
    PARAMS.forEach((d, i) => { if (!isSongParam(d.id)) this.norm[i] = norm(d, d.def); });
    const setId = (id, v) => {
      const d = PARAMS[PARAM_INDEX[id]]; if (!d) { console.warn('preset: param desconocido', id); return; }
      if (typeof v === 'string') { const k = d.opts ? d.opts.indexOf(v) : -1; if (k < 0) { console.warn('preset: opción desconocida', id, v); return; } v = d.min + k; }
      this.norm[d.index] = norm(d, v);
    };
    for (const [id, v] of Object.entries(p.params || {})) if (!isSongParam(id)) setId(id, v);
    (p.fx || []).forEach((f, i) => {
      const slot = i + 1, ti = FX_INDEX[f.type.toLowerCase().replace(/\s+/g, '')] ?? FX_TYPES.findIndex(t => t.name === f.type);
      if (ti < 0) return;
      setId(`fx${slot}.type`, ti); setId(`fx${slot}.on`, f.on === false ? 0 : 1); setId(`fx${slot}.mix`, f.mix ?? 1);
      const t = FX_TYPES[ti];
      t.params.forEach((pd, k) => {
        let v = f.params && f.params[k] !== undefined ? f.params[k] : pd.def;
        if (typeof v === 'string') v = Math.max(0, pd.opts.indexOf(v));
        this.norm[pidx(`fx${slot}.p${k}`)] = pd.curve === 'enum' ? (pd.max > 0 ? v / pd.max : 0) : norm(pd, v);
      });
    });
    this.mods = (p.mods || []).map(([s, d, a]) => ({ src: SRC_INDEX[s], dst: PARAM_INDEX[d], amt: a })).filter(m => m.src !== undefined && m.dst !== undefined);
    this.meta = { name: p.name, category: p.category || 'User', description: p.description || '', macroNames: (p.macroNames || ['Macro 1', 'Macro 2', 'Macro 3', 'Macro 4']).slice() };
  }
  loadPreset(i) {
    const all = this.allPresets();
    i = ((i % all.length) + all.length) % all.length;
    this.presetIndex = i;
    this.stopAll();
    this.presetToState(all[i]);
    this.audio.allOff();
    this.audio.setAllParams(this.norm); this.audio.setMods(this.mods);
    this.presetSel.value = i;
    this.buildEngineBody('a'); this.buildEngineBody('b');
    for (let s = 1; s <= FX_SLOTS; s++) this.buildFxSlot(s);
    for (let k = 0; k < 4; k++) this.setMacroName(k, this.meta.macroNames[k]);
    if (this.soundTitle) { this.soundTitle.textContent = this.meta.name; this.soundDesc.textContent = this.meta.description; }
    if (this.soundCards) this.soundCards.querySelectorAll('.sound-card').forEach(c => c.classList.toggle('active', parseInt(c.dataset.i, 10) === i));
    this.activeChords.clear();
    if (this.padGrid) this.applyPolyRule();
    this.refreshAll();
  }
  stateToPreset(name) {
    const params = {};
    PARAMS.forEach((d, i) => { if (Math.abs(this.norm[i] - norm(d, d.def)) > 1e-6 && !d.id.startsWith('fx')) params[d.id] = denorm(d, this.norm[i]); });
    const fx = [];
    for (let s = 1; s <= FX_SLOTS; s++) {
      const t = FX_TYPES[Math.round(this.value(`fx${s}.type`))];
      fx.push({ type: t.name, on: this.value(`fx${s}.on`) > 0.5, mix: this.value(`fx${s}.mix`), params: t.params.map((pd, k) => { const n = this.norm[pidx(`fx${s}.p${k}`)]; return pd.curve === 'enum' ? Math.round(n * pd.max) : denorm(pd, n); }) });
    }
    return { name, category: 'User', description: this.meta.description, macroNames: this.meta.macroNames.slice(), params, fx, mods: this.mods.map(m => [MOD_SOURCES[m.src].id, PARAMS[m.dst].id, m.amt]) };
  }
  savePreset() {
    const name = prompt('Nombre del preset:', this.meta.name === 'Init' ? 'Mi sonido' : this.meta.name);
    if (!name) return;
    const p = this.stateToPreset(name);
    const existing = this.userPresets.findIndex(x => x.name === name);
    if (existing >= 0) this.userPresets[existing] = p; else this.userPresets.push(p);
    localStorage.setItem('prisma.userPresets', JSON.stringify(this.userPresets));
    this.presetIndex = PRESETS.length + (existing >= 0 ? existing : this.userPresets.length - 1);
    this.meta.name = name; if (this.soundTitle) this.soundTitle.textContent = name;
    this.fillPresetSelect(); this.buildSoundCards();
  }
  exportPreset() {
    const p = this.stateToPreset(this.meta.name);
    const blob = new Blob([JSON.stringify(p, null, 2)], { type: 'application/json' });
    const a = h('a', { href: URL.createObjectURL(blob), download: `${p.name.replace(/[^\w-]+/g, '_')}.prisma.json` });
    document.body.append(a); a.click(); a.remove();
  }
  async importPreset(file) {
    if (!file) return;
    try {
      const p = JSON.parse(await file.text());
      if (!p.name) p.name = file.name.replace(/\.json$/, '');
      this.userPresets.push(p);
      localStorage.setItem('prisma.userPresets', JSON.stringify(this.userPresets));
      this.fillPresetSelect(); this.buildSoundCards(); this.loadPreset(PRESETS.length + this.userPresets.length - 1);
    } catch (e) { alert('No se pudo importar: ' + e.message); }
  }
  async loadSampleFile(file, X) {
    if (!file) return;
    await this.start();
    try {
      const info = await this.audio.loadSample(await file.arrayBuffer());
      const target = X || (ENGINE_TYPES[Math.round(this.value('a.type'))] === 'gran' || ENGINE_TYPES[Math.round(this.value('a.type'))] === 'smp' ? 'a' : 'b');
      const type = ENGINE_TYPES[Math.round(this.value(`${target}.type`))];
      if (type !== 'gran' && type !== 'smp') this.setValue(`${target}.type`, ENGINE_TYPES.indexOf('gran'));
      const t2 = ENGINE_TYPES[Math.round(this.value(`${target}.type`))];
      this.setValue(`${target}.${t2}.source`, 4);
      this.setValue(`${target}.on`, 1);
      console.info(`Sample cargado (${info.duration.toFixed(2)} s) en motor ${target.toUpperCase()}`);
    } catch (e) { alert('No se pudo decodificar el audio: ' + e.message); }
  }
}

const app = new App();
window.prisma = app;
app.build();

</script>
