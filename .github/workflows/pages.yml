# Publica las apps web del repo en GitHub Pages cada vez que se actualiza main:
#   - armonia/  →  https://agustincorreas.github.io/codex-playground/
#   - ensayo/   →  https://agustincorreas.github.io/codex-playground/ensayo/
#   - pulso/    →  https://agustincorreas.github.io/codex-playground/pulso/ (demo con mercado simulado)
#   - sound-of-money/  →  https://agustincorreas.github.io/codex-playground/sound-of-money/
name: Publicar apps web en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['armonia/**', 'ensayo/**', 'pulso/**', 'sound-of-money/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pulso/package-lock.json
      - name: Compilar el demo de Pulso (una sola página)
        working-directory: pulso
        run: |
          npm ci
          npm run build:demo
      - name: Armar el sitio (Armonía en la raíz, Ensayo en /ensayo/, Pulso en /pulso/, The Sound of Money en /sound-of-money/)
        run: |
          mkdir -p _site/ensayo _site/pulso _site/sound-of-money
          cp -r armonia/. _site/
          cp -r ensayo/. _site/ensayo/
          cp -r sound-of-money/. _site/sound-of-money/
          rm -rf _site/sound-of-money/data/raw _site/sound-of-money/data/build.py
          cp pulso/dist-demo/index.html _site/pulso/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
