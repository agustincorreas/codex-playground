# Publica la carpeta armonia/ en GitHub Pages cada vez que se actualiza main.
# URL resultante: https://agustincorreas.github.io/codex-playground/
name: Publicar Armonía en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['armonia/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: armonia
      - id: deployment
        uses: actions/deploy-pages@v4
